# Section 3 of the Fisher-sensitivity follow-up: ResNet-50 fork
# of config_t2_low.yaml. Two changes vs the baseline:
#   - model: resnet50 (~23.5M params, BasicBlock -> Bottleneck)
#   - clients_per_gpu: 2 (memory headroom on V100 16GB; ResNet-50
#     activation footprint at B=16 fits 2/GPU comfortably but
#     3/GPU is tight)
#
# Mirrors hpc/config_t2_low.yaml otherwise so the only intentional
# differences vs the ResNet-18 baseline trajectory are the
# architecture itself and the per-GPU client packing.
model: resnet50
num_classes: 10
image_size: 32
pretrain_epochs: 0
pretrain_lr: 0.1
pretrain_batch_size: 128

num_clients: 300
clients_per_round: 30
num_rounds: 250
client_batch_size: 16
client_local_steps: 10
client_lr: 0.01
fl_lr: 1.0

alpha: 1.0
beta: 1.0
gamma: 1.0

# Grad-accum trigger calibration matches ResNet-18 baseline.
T1: 0.3
T2: 0.3
grad_accum_enabled: true
grad_accum_K: 4
grad_accum_threshold: 0.3

entropy_bins: 50

empirical_iterations: 50
empirical_lr: 0.1

gi_iters: 1000
gi_lr: 0.1

mi_samples_per_class: 20

# Fisher / encryption (must match baseline)
fisher_topk: 50
encryption_top_percent: 0.1

save_every_n_rounds: 2

# Explicitly enable artefact saving (DEFAULT_CONFIG appears to default to
# False; slurm_k_sweep.sh sets this via tmp YAML override, but we're
# using this config directly so we set it here).
save_artifacts: true

# Focus layers: ResNet-50's classifier head is 'fc.*' (torchvision
# convention, same as ResNet-18). Standard whitelist applies.
focus_layers: ['fc.weight', 'fc.bias']

# ResNet-50 is ~2x ResNet-18 params and ~3-4x activation footprint
# at B=16. Observed OOM with 2 workers/GPU on V100 16GB (185401 stderr:
# torch.OutOfMemoryError cascade starting from torch.sort scratch in
# Gini compute, then propagating through subsequent client forward
# passes). Drop to 1 worker/GPU; trades ~2x slower per-round wall-clock
# for stability.
clients_per_gpu: 1

# Hard 3-of-10 non-IID partition matching the paper.
classes_per_client: 3
min_samples_per_client: 30

seed: 42
