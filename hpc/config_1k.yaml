# AdaGuard 1000-Client Configuration
# For multi-GPU / multi-node runs on Matilda
#
# CIFAR-10 has 50K training images. With 1000 clients and 3 classes each,
# each gets ~48 samples (non-IID). No pretraining — matches MaskCrypt paper.
#
# MaskCrypt paper settings: 100 clients, 20/round (20%), IID, lr=0.1, 5 epochs
# Our settings: 1000 clients, 100/round (10%), non-IID, lr=0.01, 10 steps
# Non-IID with 1000 clients requires more rounds to converge.
#
# Override at runtime: python run_headless.py --config hpc/config_1k.yaml \
#     --num-clients 2000 --clients-per-round 100

# Model
model: resnet18
num_classes: 10
image_size: 32
pretrain_epochs: 0          # no pretraining — train from scratch (matches MaskCrypt paper)
pretrain_lr: 0.1
pretrain_batch_size: 128

# Federated Learning — 1K clients
num_clients: 1000
clients_per_round: 100      # 10% participation
num_rounds: 250             # non-IID needs more rounds to converge
client_batch_size: 16       # smaller batch for ~48 samples/client
client_local_steps: 10      # ~5 epochs over 48 samples (matches MaskCrypt: 5 epochs)
client_lr: 0.01             # 0.1 diverges with non-IID; 0.01 was stable and improving
fl_lr: 1.0                  # server-side lr (1.0 = standard FedAvg)

# LeakScore weights
alpha: 1.0
beta: 1.0
gamma: 1.0

# Encryption thresholds
T1: 0.3
T2: 0.7

# Entropy metric
entropy_bins: 50

# Empirical attack settings
# NOTE: The attack code was designed for ~20 iterations ("lightweight").
# 50 is a good balance between quality and speed.
# 300 was causing 200s/client (way too slow).
empirical_iterations: 50
empirical_lr: 0.1

# Full GI attack
gi_iters: 1000
gi_lr: 0.1

# Label metric
# 20 samples/class = 200 forward passes total (was 50 = 500 passes, too slow)
mi_samples_per_class: 20

# Fisher / MaskCrypt
fisher_topk: 50
encryption_top_percent: 0.1

# Artifact saving cadence.
# Per-client artifact (measured): ~86 MB after dropping fisher tensors
# from metrics (slim fix in _process_client).
#
# Disk math at 500 clients / 50 per round / 250 rounds / save_every=2:
#   125 saved rounds × 50 clients × 86 MB = 538 GB per experiment
#   × 12 experiments = 6.5 TB total (fits 10 TB with 3.5 TB headroom).
#
# Odd/even rounds are highly correlated in FL, so dropping every other
# round for the artifact stream doesn't hurt Phase 2 scenario coverage.
# (Checkpoints + global_model still saved every round for resume.)
save_every_n_rounds: 2

# Focus layers
focus_layers: ['fc.weight', 'fc.bias']

# Parallelism — 4 V100s x 3 clients/GPU = 12 concurrent clients
# With deferred attacks, each client only needs ~300MB for training.
# 6/GPU causes GPU contention (threads serialize on default CUDA stream).
# 3/GPU is the sweet spot: enough parallelism, less contention.
clients_per_gpu: 3

# Sweeps
batch_sizes_experiment: [1, 4, 8, 16, 32, 64, 128, 256]
noise_levels: [0, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5]
client_counts_experiment: [10, 50, 100, 500, 1000]

# Data partition
classes_per_client: 3       # non-IID: each client sees 3 of 10 classes
min_samples_per_client: 30  # ensure at least 30 samples per client

# Seed
seed: 42
