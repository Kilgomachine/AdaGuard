# AdaGuard 1000-Client Configuration
# For multi-GPU / multi-node runs on Matilda
#
# CIFAR-10 has 50K training images. With 1000 clients, each gets ~50 samples
# (non-IID: 2 classes, ~25 samples/class). This is realistic for cross-device FL.
#
# Override at runtime: python run_headless.py --config hpc/config_1k.yaml \
#     --num-clients 2000 --clients-per-round 100

# Model
model: resnet18
num_classes: 10
image_size: 32
pretrain_epochs: 0
pretrain_lr: 0.01
pretrain_batch_size: 256

# Federated Learning — 1K clients
num_clients: 1000
clients_per_round: 50       # 5% participation rate (standard for cross-device FL)
num_rounds: 50
client_batch_size: 16       # smaller batch for ~50 samples/client
client_local_steps: 10      # ~2 local epochs per round
client_lr: 0.01             # local SGD learning rate
fl_lr: 1.0                  # server-side lr (1.0 = standard FedAvg)

# LeakScore weights
alpha: 1.0
beta: 1.0
gamma: 1.0

# Encryption thresholds
T1: 0.3
T2: 0.7

# Entropy metric
entropy_bins: 50

# Empirical attack settings
empirical_iterations: 300
empirical_lr: 0.1

# Full GI attack
gi_iters: 1000
gi_lr: 0.1

# Label metric
mi_samples_per_class: 50

# Fisher / MaskCrypt
fisher_topk: 50
encryption_top_percent: 0.1

# Focus layers
focus_layers: ['fc.weight', 'fc.bias']

# Parallelism — 4 V100s, 2 clients/GPU to avoid OOM with 50 concurrent
clients_per_gpu: 2

# Sweeps
batch_sizes_experiment: [1, 4, 8, 16, 32, 64, 128, 256]
noise_levels: [0, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5]
client_counts_experiment: [10, 50, 100, 500, 1000]

# Seed
seed: 42
